minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# 临时证据与原始项目定义不参与自动修改。
exclude: '^(internal-testing/|results/|evidence/|docs/Original_Project_Definition\.md$)'

repos:
  - repo: local
    hooks:
      - id: pytest-framework
        name: Require pytest tests and runner
        entry: uv run --locked python scripts/check_test_framework.py
        language: system
        types: [python]
        pass_filenames: false
      - id: tui-catalog
        name: Validate TUI catalogs and message references
        entry: uv run --locked python scripts/check_tui_catalog.py
        language: system
        types: [python]
        files: '^(acprof/|scripts/check_tui_catalog\.py$|tests/tui/i18n/)'
        pass_filenames: false
      - id: ruff-check
        name: Ruff from uv.lock
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: shared-boundaries
        name: Check exception and complexity limits in shared boundaries
        entry: uv run --locked ruff check --select BLE001,C901 --force-exclude
        language: system
        types: [python]
        files: '^acprof/(config_constraints|input_budget|image_inputs|gpu_probe|host/gpu_metadata)\.py$'
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
        # 固定 30 秒音频输入约 938 KiB；统一检查所有文件，限制为 1 MiB。
        args: [--enforce-all, --maxkb=1024]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724 # v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        # 将 Git 提供的消息文件传给 --edit，也支持手动校验指定文件。
        pass_filenames: true
        additional_dependencies:
          - '@commitlint/cli@21.2.2'
          - '@commitlint/config-conventional@21.2.2'
