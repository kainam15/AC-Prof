[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acprof"
dynamic = ["version"]
description = "Reproducible profiling of containerized Hugging Face inference services"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "AC-Prof contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
]
# The distribution includes the CC-BY-4.0 LibriSpeech excerpt described in NOTICE.
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "licenses/CC-BY-4.0.txt"]
dependencies = [
    "requests>=2.31,<3",
    "huggingface-hub>=1.28,<2",
    "modelscope-hub>=0.1.9,<0.2",
    "packaging>=25,<27",
    # Hub clients inherit system SOCKS proxies through HTTPX's optional transport.
    "httpx[socks]>=0.28.1,<1",
    "textual>=8.2.8,<9",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "matplotlib>=3.7,<4",
    "plotly>=7.1,<8",
    "Pillow>=10.0",
    "nvidia-ml-py>=13.610.43",
    "psutil>=7.2,<8",
]

[dependency-groups]
# `uv sync` prepares the complete everyday development environment.
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "runtime-tools"},
]
test = [
    {include-group = "runtime-test"},
    "pytest-cov>=7.0.0,<8",
    "coverage[toml]>=7.15.2,<8",
    "pyyaml>=6.0.3,<7",
]
lint = [
    # Keep the Ruff configuration and pre-commit hook on the same release.
    "ruff==0.16.8",
    "pre-commit>=4.6.2,<5",
    "markdown-it-py>=4.2.0,<5",
]
typing = ["mypy>=2.3.1,<3"]
browser = [
    {include-group = "runtime-test"},
    "plotly>=7.1.0,<8",
    "playwright>=1.63.0,<2",
]
# Exported with hashes and installed only into the temporary container test venv.
runtime-test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.4.0,<2"]
# pip supplies cross-platform wheel downloads; uv owns this tool's environment.
runtime-tools = ["pip>=26.2.2,<27"]
audit = ["pip-audit>=2.10.1,<3"]
build = ["hatchling>=1.27,<2"]
standalone = ["pyinstaller>=6.22.3,<7"]

[tool.uv]
required-version = "==0.13.5"
default-groups = ["dev"]

[project.scripts]
acprof = "acprof.cli.main:main"

[project.urls]
Homepage = "https://github.com/kainam15/AC-Prof"
Documentation = "https://github.com/kainam15/AC-Prof/blob/main/docs/README.md"
Repository = "https://github.com/kainam15/AC-Prof"
Issues = "https://github.com/kainam15/AC-Prof/issues"
Changelog = "https://github.com/kainam15/AC-Prof/releases"

[tool.hatch.version]
path = "acprof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["acprof"]
exclude = [
    "**/AGENTS.md", "**/__pycache__", "**/*.pyc",
    "**/tests", "**/docs", "**/.git", "**/.github", "**/.codex",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "packaging/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/acprof", "/assets", "/dockerfiles", "/examples", "/scripts", "/tests",
    "/packaging", "/docs", "/README.md", "/pyproject.toml",
    "/uv.lock", "/.python-version", "/.dockerignore", "/setup.sh",
    "/LICENSE", "/NOTICE", "/licenses",
]
exclude = ["**/AGENTS.md", "**/__pycache__", "**/*.pyc"]

[tool.ruff]
required-version = "==0.16.8"
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = ["internal-testing", "results", "evidence"]

[tool.ruff.lint]
# 基础错误、import 排序、Python 3.12 语法及 pytest 约束。
select = ["E4", "E7", "E9", "F", "B006", "B012", "B904", "B905", "I", "UP", "PT", "RUF010", "RUF013", "SIM101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
packages = ["acprof"]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Tighter gates only for fully annotated, validated protocol and UI modules.
[[tool.mypy.overrides]]
module = [
    "acprof.analysis.precision",
    "acprof.analysis.latency_validation",
    "acprof.host.measurement.metrics",
    "acprof.host.measurement.error_rows",
    "acprof.host.cases",
    "acprof.host.machine_metadata",
    "acprof.host.command",
    "acprof.host.images.identity",
    "acprof.monitors.interfaces",
    "acprof.pixel_metrics",
    "acprof.source_identity",
    "acprof.tui.commands",
    "acprof.tui.process_completion",
    "acprof.tui.experiment_controller",
    "acprof.tui.profile_controller",
    "acprof.run_options",
    "acprof.tui.settings",
]
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
branch = true
parallel = true
patch = "subprocess"
source = ["acprof"]
relative_files = true
data_file = "internal-testing/coverage/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2
# First establish evidence; do not gate the repository on a global percentage.

[tool.coverage.xml]
output = "internal-testing/coverage/coverage.xml"

[tool.coverage.json]
output = "internal-testing/coverage/coverage.json"

[tool.coverage.html]
directory = "internal-testing/coverage/html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-p acprof.testing.plugin --strict-markers --import-mode=importlib"
markers = [
    "unit: isolated tests without real hardware or external services",
    "wsl: WSL2 integration tests, skipped outside WSL2",
    "native_linux: tests requiring native Linux measurement semantics",
    "hardware: tests requiring real hardware and explicitly provisioned prerequisites",
    "integration: opt-in external service or browser integration",
    "runtime: tests requiring a selected container runtime's dependencies",
    "visual: deterministic Textual SVG regression",
]
