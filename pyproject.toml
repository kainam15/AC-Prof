[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acprof"
dynamic = ["version"]
description = "Reproducible profiling of containerized Hugging Face inference services"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AC-Prof contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
# The distribution includes the CC-BY-4.0 LibriSpeech excerpt described in NOTICE.
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "licenses/CC-BY-4.0.txt"]
dependencies = [
    "requests>=2.31,<3",
    "huggingface-hub>=1.0,<2",
    "packaging>=25,<27",
    "socksio>=1.0,<2",
    "textual>=8.2.8,<9",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "matplotlib>=3.7,<4",
    "plotly>=7.1,<8",
    "Pillow>=10.0",
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
acprof = "acprof.cli.main:main"

[project.urls]
Homepage = "https://github.com/kainam15/AC-Prof"
Documentation = "https://github.com/kainam15/AC-Prof/blob/main/docs/Getting_Started.md"
Repository = "https://github.com/kainam15/AC-Prof"
Issues = "https://github.com/kainam15/AC-Prof/issues"
Changelog = "https://github.com/kainam15/AC-Prof/releases"

[tool.hatch.version]
path = "acprof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["acprof"]
exclude = [
    "**/AGENTS.md", "**/__pycache__", "**/*.pyc",
    "**/tests", "**/docs", "**/.git", "**/.github", "**/.codex",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "packaging/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/acprof", "/assets", "/dockerfiles", "/examples", "/scripts", "/tests",
    "/packaging", "/docs", "/README.md", "/pyproject.toml",
    "/requirements", "/.dockerignore", "/setup.sh",
    "/LICENSE", "/NOTICE", "/licenses",
]
exclude = ["**/AGENTS.md", "**/__pycache__", "**/*.pyc"]

[tool.ruff]
required-version = "==0.16.8"
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = ["internal-testing", "results", "evidence"]

[tool.ruff.lint]
# 基础错误、import 排序及经过单独核对的少量低风险规则。
select = ["E4", "E7", "E9", "F", "B006", "B012", "B904", "I", "RUF010", "RUF013", "SIM101"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
files = [
    "acprof/experiment.py",
    "acprof/artifacts.py",
    "acprof/artifact_layout.py",
    "acprof/extensions/schema.py",
    "acprof/container/handlers/__init__.py",
    "acprof/monitors/interfaces.py",
    "acprof/host/measurement_window.py",
    "acprof/host/command.py",
    "acprof/host/matrix_plan.py",
    "acprof/host/run_state.py",
    "acprof/host/compute_profile_plan.py",
    "acprof/host/execution_profile_plan.py",
    "acprof/host/profiler_support.py",
    "acprof/host/profilers/compute_parsers.py",
    "acprof/host/profilers/execution_parsers.py",
    "acprof/analysis/comparison.py",
    "acprof/analysis/independent_comparison.py",
    "acprof/analysis/uncertainty.py",
    "acprof/analysis/latency_report.py",
    "acprof/host/runtime_validation.py",
    "acprof/testing/provenance.py",
    "acprof/testing/sharding.py",
]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
branch = true
parallel = true
source = ["acprof"]
relative_files = true
data_file = "internal-testing/coverage/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2
# First establish evidence; do not gate the repository on a global percentage.

[tool.coverage.xml]
output = "internal-testing/coverage/coverage.xml"

[tool.coverage.json]
output = "internal-testing/coverage/coverage.json"

[tool.coverage.html]
directory = "internal-testing/coverage/html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-p acprof.testing.plugin --strict-markers --import-mode=importlib"
markers = [
    "unit: isolated tests without real hardware or external services",
    "wsl: WSL2 integration tests, skipped outside WSL2",
    "native_linux: tests requiring native Linux measurement semantics",
    "hardware: tests requiring real hardware and explicitly provisioned prerequisites",
    "integration: opt-in external service or browser integration",
    "runtime: tests requiring a selected container runtime's dependencies",
    "visual: deterministic Textual SVG regression",
]
