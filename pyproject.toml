[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acprof"
dynamic = ["version"]
description = "Reproducible profiling of containerized Hugging Face inference services"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AC-Prof contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
# The distribution includes the CC-BY-4.0 LibriSpeech excerpt described in NOTICE.
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "licenses/CC-BY-4.0.txt"]
dependencies = [
    "requests>=2.31,<3",
    "huggingface-hub>=1.0,<2",
    "modelscope-hub>=0.1.9,<0.2",
    "packaging>=25,<27",
    "socksio>=1.0,<2",
    "textual>=8.2.8,<9",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "matplotlib>=3.7,<4",
    "plotly>=7.1,<8",
    "Pillow>=10.0",
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
acprof = "acprof.cli.main:main"

[project.urls]
Homepage = "https://github.com/kainam15/AC-Prof"
Documentation = "https://github.com/kainam15/AC-Prof/blob/main/docs/README.md"
Repository = "https://github.com/kainam15/AC-Prof"
Issues = "https://github.com/kainam15/AC-Prof/issues"
Changelog = "https://github.com/kainam15/AC-Prof/releases"

[tool.hatch.version]
path = "acprof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["acprof"]
exclude = [
    "**/AGENTS.md", "**/__pycache__", "**/*.pyc",
    "**/tests", "**/docs", "**/.git", "**/.github", "**/.codex",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "packaging/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/acprof", "/assets", "/dockerfiles", "/examples", "/scripts", "/tests",
    "/packaging", "/docs", "/README.md", "/pyproject.toml",
    "/requirements", "/.dockerignore", "/setup.sh",
    "/LICENSE", "/NOTICE", "/licenses",
]
exclude = ["**/AGENTS.md", "**/__pycache__", "**/*.pyc"]

[tool.ruff]
required-version = "==0.16.8"
target-version = "py310"
line-length = 100
force-exclude = true
extend-exclude = ["internal-testing", "results", "evidence"]

[tool.ruff.lint]
# 基础错误、import 排序及经过单独核对的少量低风险规则。
select = ["E4", "E7", "E9", "F", "B006", "B012", "B904", "B905", "I", "RUF010", "RUF013", "SIM101"]

[tool.ruff.lint.isort]
combine-as-imports = true

