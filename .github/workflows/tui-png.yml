name: TUI PNG Visual

# Independent from normal host/SVG tests: run only for changes that can affect
# terminal rendering. Manual dispatch remains available for visual review.
on:
  push:
    branches: [main]
    paths:
      - 'acprof/tui/**'
      - 'acprof/tasks/**'
      - 'acprof/messages/**'
      - 'acprof/platform.py'
      - 'acprof/experiments/configuration.py'
      - 'tests/visual/**'
      - 'tests/visual_png/**'
      - 'scripts/capture_tui_png.py'
      - 'scripts/smoke_tui_png_environment.py'
      - 'scripts/compare_tui_png.py'
      - '.github/workflows/tui-png.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'acprof/tui/**'
      - 'acprof/tasks/**'
      - 'acprof/messages/**'
      - 'acprof/platform.py'
      - 'acprof/experiments/configuration.py'
      - 'tests/visual/**'
      - 'tests/visual_png/**'
      - 'scripts/capture_tui_png.py'
      - 'scripts/smoke_tui_png_environment.py'
      - 'scripts/compare_tui_png.py'
      - '.github/workflows/tui-png.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  png-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install optional headless terminal tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttyd ffmpeg fonts-noto-cjk unzip apparmor
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/vhs_0.12.1_amd64.deb \
            https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_amd64.deb
          echo '30a9b2746f19522387eace24f427208b5dc4ce2413d334147a0b89a2304cfbe4  /tmp/vhs_0.12.1_amd64.deb' | sha256sum --check
          sudo apt-get install -y /tmp/vhs_0.12.1_amd64.deb
          # Freeze browser & font renderer to match the reviewed Ubuntu 24.04 goldens.
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/chrome-linux64.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/147.0.7727.116/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          mkdir -p "$RUNNER_TEMP/chrome-shim"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' \
            "$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome" \
            > "$RUNNER_TEMP/chrome-shim/google-chrome"
          chmod +x "$RUNNER_TEMP/chrome-shim/google-chrome"
          echo "$RUNNER_TEMP/chrome-shim" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrome-shim/google-chrome" --version | grep '147.0.7727.116'
          # Ubuntu 24.04 restricts user namespaces for unpackaged Chrome for Testing.
          # Allow only this pinned Chrome executable to create its own sandbox.
          # Do not disable the kernel restriction or launch Chrome with --no-sandbox.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" = "1" ]; then
            chrome_binary="$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome"
            profile="/etc/apparmor.d/acprof-vhs-chrome"
            {
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\n'
              printf 'profile acprof-vhs-chrome %s flags=(unconfined) {\n' "$chrome_binary"
              printf '  userns,\n}\n'
            } | sudo tee "$profile" >/dev/null
            sudo apparmor_parser --replace "$profile"
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          echo 'b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc' | sha256sum --check
          fc-match 'Noto Sans Mono CJK SC'
      - name: Smoke-test headless Chrome and VHS recording
        run: python3 scripts/smoke_tui_png_environment.py
      - name: Install host test dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Capture and check real TUI scenes
        env:
          ACPROF_PNG_VISUAL: '1'
          TZ: UTC
          PYTHONHASHSEED: '0'
        run: uv run --locked --no-default-groups --group test python -m pytest tests/visual_png -v
      - name: Upload actual, expected, diff and summary for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-png-visual
          path: |
            internal-testing/tui-png/*.png
            internal-testing/tui-png/diff/**/*.png
            internal-testing/tui-png/report.json
            tests/visual_png/__snapshots__/*.png
          if-no-files-found: warn
