name: TUI PNG Visual

# Independent from normal host/SVG tests: run only for changes that can affect
# terminal rendering. Manual dispatch remains available for visual review.
on:
  push:
    branches: [main]
    paths:
      - 'acprof/tui/**'
      - 'acprof/tasks/**'
      - 'acprof/messages/**'
      - 'acprof/platform.py'
      - 'acprof/experiments/configuration.py'
      - 'tests/visual/**'
      - 'tests/visual_png/**'
      - 'scripts/capture_tui_png.py'
      - 'scripts/smoke_tui_png_environment.py'
      - 'scripts/compare_tui_png.py'
      - 'scripts/render_tui_png_report.py'
      - 'scripts/tui_png_review_ui.py'
      - 'scripts/capture_tui_journey.py'
      - 'scripts/tui_pilot_png.py'
      - 'scripts/tui_pilot_font.py'
      - 'scripts/tui_svg_preview_png.py'
      - 'scripts/tui_journey_contract.py'
      - 'scripts/tui_journey_report.py'
      - 'tests/tui/workflows/visual_journey.py'
      - 'tests/tui/workflows/test_tui_visual_journey.py'
      - 'scripts/tui_flow_catalog.py'
      - 'scripts/tui_flow_report.py'
      - '.github/workflows/tui-png.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'acprof/tui/**'
      - 'acprof/tasks/**'
      - 'acprof/messages/**'
      - 'acprof/platform.py'
      - 'acprof/experiments/configuration.py'
      - 'tests/visual/**'
      - 'tests/visual_png/**'
      - 'scripts/capture_tui_png.py'
      - 'scripts/smoke_tui_png_environment.py'
      - 'scripts/compare_tui_png.py'
      - 'scripts/render_tui_png_report.py'
      - 'scripts/tui_png_review_ui.py'
      - 'scripts/capture_tui_journey.py'
      - 'scripts/tui_pilot_png.py'
      - 'scripts/tui_pilot_font.py'
      - 'scripts/tui_svg_preview_png.py'
      - 'scripts/tui_journey_contract.py'
      - 'scripts/tui_journey_report.py'
      - 'tests/tui/workflows/visual_journey.py'
      - 'tests/tui/workflows/test_tui_visual_journey.py'
      - 'scripts/tui_flow_catalog.py'
      - 'scripts/tui_flow_report.py'
      - '.github/workflows/tui-png.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs for each ref so an older build cannot replace a newer report.
concurrency:
  group: tui-png-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  png-visual:
    runs-on: ubuntu-24.04
    outputs:
      pages_ready: ${{ steps.prepare_pages.outputs.ready }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install optional headless terminal tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ttyd ffmpeg fonts-noto-cjk unzip apparmor
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/vhs_0.12.1_amd64.deb \
            https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_amd64.deb
          echo '30a9b2746f19522387eace24f427208b5dc4ce2413d334147a0b89a2304cfbe4  /tmp/vhs_0.12.1_amd64.deb' | sha256sum --check
          sudo apt-get install -y /tmp/vhs_0.12.1_amd64.deb
          # Freeze browser & font renderer to match the reviewed Ubuntu 24.04 goldens.
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/chrome-linux64.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/147.0.7727.116/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          mkdir -p "$RUNNER_TEMP/chrome-shim"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' \
            "$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome" \
            > "$RUNNER_TEMP/chrome-shim/google-chrome"
          chmod +x "$RUNNER_TEMP/chrome-shim/google-chrome"
          # Use Chrome's dedicated headless shell for offline SVG rendering;
          # full Chrome's GCM/background services can stall its screenshot CLI.
          curl --fail --location --silent --show-error --retry 3 \
            -o "$RUNNER_TEMP/chrome-headless-shell-linux64.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/147.0.7727.116/linux64/chrome-headless-shell-linux64.zip
          echo "8b3584f747a3a7155e1f99dc712dfd0576eedafe3da331819ccd52e17bee61a6  $RUNNER_TEMP/chrome-headless-shell-linux64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome-headless-shell-linux64.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' \
            "$RUNNER_TEMP/chrome-for-testing/chrome-headless-shell-linux64/chrome-headless-shell" \
            > "$RUNNER_TEMP/chrome-shim/chrome-headless-shell"
          chmod +x "$RUNNER_TEMP/chrome-shim/chrome-headless-shell"
          echo "$RUNNER_TEMP/chrome-shim" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrome-shim/google-chrome" --version | grep '147.0.7727.116'
          "$RUNNER_TEMP/chrome-shim/chrome-headless-shell" --version | grep '147.0.7727.116'
          # Ubuntu 24.04 restricts user namespaces for unpackaged Chrome for Testing.
          # Allow only this pinned Chrome executable to create its own sandbox.
          # Do not disable the kernel restriction or launch Chrome with --no-sandbox.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" = "1" ]; then
            chrome_binary="$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome"
            profile="/etc/apparmor.d/acprof-vhs-chrome"
            {
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\n'
              printf 'profile acprof-vhs-chrome %s flags=(unconfined) {\n' "$chrome_binary"
              printf '  userns,\n}\n'
            } | sudo tee "$profile" >/dev/null
            sudo apparmor_parser --replace "$profile"
            # Keep the same userns restriction exception, scoped only to the
            # downloaded headless-shell binary (never a global sandbox bypass).
            shell_binary="$RUNNER_TEMP/chrome-for-testing/chrome-headless-shell-linux64/chrome-headless-shell"
            profile="/etc/apparmor.d/acprof-svg-preview-chrome-shell"
            {
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\n'
              printf 'profile acprof-svg-preview-chrome-shell %s flags=(unconfined) {\n' "$shell_binary"
              printf '  userns,\n}\n'
            } | sudo tee "$profile" >/dev/null
            sudo apparmor_parser --replace "$profile"
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          echo 'b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a  /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc' | sha256sum --check
          fc-match 'Noto Sans Mono CJK SC'
      - name: Smoke-test headless Chrome and VHS recording
        run: python3 scripts/smoke_tui_png_environment.py
      - name: Install host test dependencies
        run: uv sync --locked --no-default-groups --group test
      # Prepare offline SVG previews before long-running VHS/Pilot captures.
      - name: Smoke-test one reviewed CJK SVG preview
        id: svg_preview_smoke
        if: always()
        run: |
          if [ ! -x .venv/bin/python ]; then
            echo 'Test environment unavailable; cannot render SVG preview smoke.'
            exit 1
          fi
          uv run --locked --no-default-groups --group test python scripts/tui_svg_preview_png.py --smoke
      - name: Render CJK previews of reviewed SVG baselines
        if: ${{ always() && steps.svg_preview_smoke.outcome == 'success' }}
        run: |
          if [ -x .venv/bin/python ]; then
            uv run --locked --no-default-groups --group test python scripts/tui_svg_preview_png.py
          else
            echo 'Test environment unavailable; SVG CJK previews not generated.'
          fi
      - name: Capture and check real TUI scenes
        env:
          ACPROF_PNG_VISUAL: '1'
          TZ: UTC
          PYTHONHASHSEED: '0'
        run: uv run --locked --no-default-groups --group test python -m pytest tests/visual_png -v
      - name: Capture continuous synthetic TUI Pilot journey
        if: always()
        run: |
          if [ -x .venv/bin/python ]; then
            uv run --locked --no-default-groups --group test python scripts/capture_tui_journey.py --png-preview
          else
            echo 'Test environment unavailable; journey evidence not generated.'
          fi
      - name: Render standalone HTML comparison report
        if: always()
        run: python3 scripts/render_tui_png_report.py
      - name: Check canonical developer evidence layout
        if: always()
        run: python3 scripts/internal_testing.py inventory --check
      - name: Upload HTML, actual, expected, diff and summary for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-png-visual
          path: |
            internal-testing/shared/tui-png/*.png
            internal-testing/shared/tui-png/diff/**/*.png
            internal-testing/shared/tui-png/report.html
            internal-testing/shared/tui-png/report.json
            internal-testing/shared/tui-png/journey/manifest.json
            internal-testing/shared/tui-png/journey/**/*.svg
            internal-testing/shared/tui-png/journey/**/*.png
            internal-testing/shared/tui-png/svg-preview/**/*.png
            internal-testing/shared/tui-png/svg-preview/manifest.json
            internal-testing/shared/tui-png/svg-preview-failures/**/*
            tests/visual_png/__snapshots__/*.png
          if-no-files-found: warn
      # Prepare a public, standalone viewer only for main. Keep PR evidence in
      # the run-specific Artifact above; never deploy unreviewed PR output.
      - name: Prepare GitHub Pages report
        id: prepare_pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          report=internal-testing/shared/tui-png/report.html
          if [ -s "$report" ]; then
            mkdir -p "$RUNNER_TEMP/tui-png-pages"
            cp "$report" "$RUNNER_TEMP/tui-png-pages/index.html"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload GitHub Pages artifact
        if: ${{ !cancelled() && steps.prepare_pages.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/tui-png-pages

  deploy-pages:
    needs: png-visual
    # !cancelled() also allows a failed PNG regression to publish its diagnosis.
    # A missing HTML report must leave the previously published site intact.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.png-visual.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy visual report
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
