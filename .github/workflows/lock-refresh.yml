name: Dependency Lock Refresh
on:
  schedule:
    - cron: '29 4 1 * *' # Monthly, UTC; only the default branch
  workflow_dispatch:
    inputs:
      scope:
        description: Which lock families to regenerate
        type: choice
        required: true
        default: all
        options: [all, host, runtime]

permissions:
  contents: read

concurrency:
  group: acprof-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write # workflow_dispatch explicitly starts the full CI for the generated branch
    env:
      REFRESH_SCOPE: ${{ inputs.scope || 'all' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - name: Refresh the project lock and all dependency groups
        if: env.REFRESH_SCOPE == 'all' || env.REFRESH_SCOPE == 'host'
        run: uv lock --upgrade
      - name: Prepare the locked development toolchain
        run: uv sync --locked
      - name: Refresh Docker runtime Python artifact locks
        if: env.REFRESH_SCOPE == 'all' || env.REFRESH_SCOPE == 'runtime'
        shell: bash
        run: |
          set -euo pipefail
          # Resolve pinned platform wheels and runtime environments as a single
          # verified graph; do not rewrite base OCI digests or apt system locks.
          uv run --locked python scripts/compile_locks.py --upgrade
      - name: Check regenerated hashes, profiles and metadata
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv run --locked python scripts/compile_locks.py --check
          uv run --locked pytest -q tests/runtime/environment/test_lock_compiler.py tests/runtime/environment/test_dependency_locks.py \
            tests/runtime/environment/test_runtime_profiles.py tests/runtime/containers/test_container_lock_resolution.py
      - name: Stage only coordinated lock and artifact changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A uv.lock dockerfiles/locks
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Create review-only dependency update PR
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="automation/lock-refresh-${RUN_ID}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(deps): refresh ${REFRESH_SCOPE} lock artifacts"
          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
            --title "chore(deps): review ${REFRESH_SCOPE} lock refresh" \
            --body "Automated uv.lock and runtime artifact candidate with the declared uv version and locked checks. Review all version/digest changes before merging. Docker base OCI and apt system locks remain pinned; no production rollout or auto-merge."
          # A GitHub Actions GITHUB_TOKEN push does not trigger ordinary push/PR
          # workflows. workflow_dispatch is permitted, so request full CI here.
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"
