name: Coordinated dependency lock refresh
on:
  schedule:
    - cron: '29 4 1 * *' # Monthly, UTC; only the default branch
  workflow_dispatch:
    inputs:
      scope:
        description: Which lock families to regenerate
        type: choice
        required: true
        default: all
        options: [all, host, runtime]

permissions:
  contents: read

concurrency:
  group: acprof-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write # workflow_dispatch explicitly starts the full CI for the generated branch
    env:
      REFRESH_SCOPE: ${{ inputs.scope || 'all' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - name: Refresh Python host and test locks with hashes
        if: env.REFRESH_SCOPE == 'all' || env.REFRESH_SCOPE == 'host'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compile_locks.py --host-only --upgrade
          for name in runtime-test test dev; do
            uv pip compile "requirements/${name}.in" --python-version 3.10 --universal \
              --generate-hashes --no-annotate --no-header --upgrade \
              --output-file "requirements/${name}.lock"
          done
          uv pip compile requirements/browser.in --python-version 3.12 \
            --generate-hashes --no-annotate --no-header --upgrade \
            --output-file requirements/browser.lock
      - name: Refresh Docker runtime Python artifact locks
        if: env.REFRESH_SCOPE == 'all' || env.REFRESH_SCOPE == 'runtime'
        shell: bash
        run: |
          set -euo pipefail
          # Resolve pinned platform wheels and runtime environments as a single
          # verified graph; do not rewrite base OCI digests or apt system locks.
          python scripts/compile_locks.py --runtime-only --upgrade
      - name: Check regenerated hashes, profiles and metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/host.lock -r requirements/dev.lock
          python scripts/compile_locks.py --host-only --check
          python scripts/compile_locks.py --check
          python -m pytest -q tests/test_lock_compiler.py tests/test_dependency_locks.py \
            tests/test_runtime_profiles.py tests/test_container_lock_resolution.py
      - name: Stage only coordinated lock and artifact changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A requirements dockerfiles/locks
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Create review-only dependency update PR
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="automation/lock-refresh-${RUN_ID}"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(deps): refresh ${REFRESH_SCOPE} lock artifacts"
          gh auth setup-git
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
            --title "chore(deps): review ${REFRESH_SCOPE} lock refresh" \
            --body "Automated lock candidate with fixed uv, exact artifact hashes and offline lock checks. Review all version/digest changes before merging. Docker base OCI and apt system locks remain pinned; no production rollout or auto-merge."
          # A GitHub Actions GITHUB_TOKEN push does not trigger ordinary push/PR
          # workflows. workflow_dispatch is permitted, so request full CI here.
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"
