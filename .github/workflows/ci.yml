name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full:
        type: boolean
        default: true # reusable workflow 沿用 caller event（可能仍显示为 push）。

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST_TEST_SHARDS: 8

jobs:
  # PR 使用 GitHub 文件列表，push 使用对应分支推送前后的 diff；
  # 手动调用、tag release 的 reusable workflow 始终执行完整验证。
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # 仅变更识别作业需要读取 fork PR 文件列表。
    outputs:
      full: ${{ inputs.force_full || startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' && github.event_name != 'pull_request' || steps.paths.outputs.full == 'true' || steps.paths.outputs.documentation != 'true' }}
      readme: ${{ steps.paths.outputs.readme == 'true' }}
      metric: ${{ steps.paths.outputs.metric == 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.force_full && !startsWith(github.ref, 'refs/tags/')
      - name: 识别文档与代码改动
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.force_full && !startsWith(github.ref, 'refs/tags/')
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            documentation:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - '**/AGENTS.md'
              - '.agents/skills/**/*.md'
              - '.agents/skills/**/*.yaml'
              - '.agents/skills/**/*.yml'
            full:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!**/AGENTS.md'
              - '!.agents/skills/**/*.md'
              - '!.agents/skills/**/*.yaml'
              - '!.agents/skills/**/*.yml'
            readme:
              - 'README.md'
            metric:
              - 'docs/results/metric_reference.md'

  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --only-group lint
      - name: 检查 Markdown 链接、锚点、格式和 Skill YAML
        run: uv run --locked --only-group lint python scripts/check_docs.py

  # 生成字段表被手工改动时仅检查同步；源码变更则由 contracts 作业检查。
  metric-docs:
    needs: changes
    if: needs.changes.outputs.full == 'false' && needs.changes.outputs.metric == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups
      - name: 校验生成指标文档
        run: uv run --locked --no-default-groups python scripts/render_metric_reference.py --check

  lint:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv pip check
      - run: uv run --locked python -m pre_commit run --all-files --show-diff-on-failure
      - name: 禁止重新引入旧测试执行框架
        run: uv run --locked python scripts/check_test_framework.py
      - name: 禁止新增跨模块 private dependency，并清除过期 baseline
        run: uv run --locked python scripts/check_private_api.py
      - name: 禁止跨架构层反向导入
        run: uv run --locked python scripts/check_import_boundaries.py
      - name: 审查 Python 模块规模（提示，不设行数硬门槛）
        run: uv run --locked python scripts/check_module_sizes.py --top 25

  types:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group typing
      - run: uv pip check
      - run: uv run --locked --no-default-groups --group typing python -m mypy

  contracts:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv pip check
      - run: uv run --locked python scripts/compile_locks.py --check
      - run: uv lock --check
      - name: 校验指标文档编码与同步状态
        run: uv run --locked python scripts/render_metric_reference.py --check

  python313-smoke:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group test
      - run: uv pip check
      - name: Python 3.13 host and measurement-contract smoke
        run: |
          uv run --locked --no-default-groups --group test python -m pytest -q \
            tests/test_architecture.py \
            tests/test_private_api_guard.py \
            tests/test_resource_usage.py \
            tests/test_orchestrator_environment.py \
            tests/test_static_gpu_fallback.py \
            tests/test_measurement_semantics_baseline.py
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
          TZ: UTC
          PYTHONHASHSEED: '0'

  host:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --locked --no-default-groups --group test python -m pytest --version
      - run: uv pip check
      - run: |
          set -o pipefail
          mkdir -p evidence
          if [[ '${{ matrix.python }}' == '3.12' ]]; then
            uv run --locked --no-default-groups --group test python -m coverage run --branch --parallel-mode scripts/run_tests.py --shard-index ${{ matrix.shard }} --shard-count "$HOST_TEST_SHARDS" --report evidence/host.json 2>&1 | tee evidence/host.log
          else
            uv run --locked --no-default-groups --group test python scripts/run_tests.py --shard-index ${{ matrix.shard }} --shard-count "$HOST_TEST_SHARDS" --report evidence/host.json 2>&1 | tee evidence/host.log
          fi
        shell: bash
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
          TZ: UTC
          PYTHONHASHSEED: '0'
          COVERAGE_FILE: evidence/coverage/.coverage
      - name: 检查 CLI 帮助与源码编译
        if: matrix.shard == 0
        run: |
          uv run --locked --no-default-groups --group test acprof --help
          uv run --locked --no-default-groups --group test acprof run --help
          uv run --locked --no-default-groups --group test acprof probe --help
          uv run --locked --no-default-groups --group test acprof profile --help
          uv run --locked --no-default-groups --group test acprof plot --help
          uv run --locked --no-default-groups --group test acprof audit --help
          uv run --locked --no-default-groups --group test acprof stats --help
          uv run --locked --no-default-groups --group test acprof tui --help
          uv run --locked --no-default-groups --group test python -m compileall -q acprof scripts packaging
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-${{ matrix.python }}-${{ matrix.shard }}
          path: evidence/
      - name: 上传 Python 3.12 coverage 分片
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.python == '3.12'
        with:
          name: coverage-3.12-${{ matrix.shard }}
          path: evidence/coverage/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
  host-summary:
    needs: [changes, host]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --only-group test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-*
          path: evidence/shards
          merge-multiple: false
      - name: 校验两个 Python 版本的完整测试证据
        run: uv run --locked --only-group test python scripts/aggregate_test_reports.py evidence/shards --shard-count "$HOST_TEST_SHARDS" --report evidence/host-summary.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-3.12-*
          path: evidence/coverage-shards
          merge-multiple: false
      - name: 汇总全部 coverage 分片（关键路径另设 branch 门槛）
        shell: bash
        env:
          COVERAGE_FILE: evidence/coverage/.coverage
        run: |
          for ((shard=0; shard<HOST_TEST_SHARDS; shard++)); do
            compgen -G "evidence/coverage-shards/coverage-3.12-${shard}/.coverage.*" >/dev/null || exit 1
          done
          uv run --locked --only-group test python -m coverage combine --keep evidence/coverage-shards/coverage-3.12-*
          uv run --locked --only-group test python -m coverage xml -o evidence/coverage/coverage.xml
          uv run --locked --only-group test python -m coverage json -o evidence/coverage/coverage.json
          uv run --locked --only-group test python -m coverage html -d evidence/coverage/html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-baseline-3.12
          path: evidence/coverage/
          include-hidden-files: true
          if-no-files-found: error
      - name: 核对关键测量路径的分支覆盖率下限
        run: uv run --locked --only-group test python scripts/check_critical_coverage.py --report evidence/coverage/coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-summary
          path: evidence/host-summary.json

  wheel:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.readme == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - name: 从项目锁导出构建和安装约束
        run: |
          uv lock --check
          uv export --locked --no-default-groups --no-emit-project --output-file "$RUNNER_TEMP/host.txt"
          uv export --locked --only-group build --no-emit-project --output-file "$RUNNER_TEMP/build.txt"
          uv export --locked --only-group runtime-test --no-emit-project --output-file "$RUNNER_TEMP/test.txt"
      - name: 构建并隔离安装当前提交的 wheel
        run: |
          uv build --build-constraint "$RUNNER_TEMP/build.txt" --require-hashes --wheel --out-dir "$RUNNER_TEMP/wheel-dist"
          uv build --build-constraint "$RUNNER_TEMP/build.txt" --require-hashes --sdist --out-dir "$RUNNER_TEMP/sdist-dist"
          uv build --build-constraint "$RUNNER_TEMP/build.txt" --require-hashes "$RUNNER_TEMP"/sdist-dist/*.tar.gz --wheel --out-dir "$RUNNER_TEMP/sdist-wheel-dist"
          uv venv "$RUNNER_TEMP/acprof-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/acprof-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/host.txt"
          uv pip install --python "$RUNNER_TEMP/acprof-wheel/bin/python" --no-deps "$RUNNER_TEMP"/wheel-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/acprof-wheel/bin/python"
          uv venv "$RUNNER_TEMP/acprof-sdist-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/acprof-sdist-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/host.txt"
          uv pip install --python "$RUNNER_TEMP/acprof-sdist-wheel/bin/python" --no-deps "$RUNNER_TEMP"/sdist-wheel-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/acprof-sdist-wheel/bin/python"
      - name: 验证公开依赖范围可由安装器解析
        run: |
          uv venv "$RUNNER_TEMP/acprof-resolved" --python 3.12
          uv pip install --python "$RUNNER_TEMP/acprof-resolved/bin/python" --require-hashes -r "$RUNNER_TEMP/test.txt"
          uv pip install --python "$RUNNER_TEMP/acprof-resolved/bin/python" "$RUNNER_TEMP"/wheel-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/acprof-resolved/bin/python"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/acprof-resolved/bin/python" -I -c 'import acprof; print(acprof.__version__)'
          "$RUNNER_TEMP/acprof-resolved/bin/acprof" --help >/dev/null
          env -u PYTHONPATH "$RUNNER_TEMP/acprof-resolved/bin/python" -I -m pytest \
            "$GITHUB_WORKSPACE/tests/test_hf_auto_download.py" -p acprof.testing.plugin \
            --strict-markers --import-mode=importlib -q
      - name: 从空目录验证安装包、公共入口、报告资源与子进程
        shell: bash
        run: |
          mkdir -p evidence
          cp scripts/check_distribution.py "$RUNNER_TEMP/check_distribution.py"
          cd "$(mktemp -d)"
          env -u PYTHONPATH "$RUNNER_TEMP/acprof-wheel/bin/python" -I "$RUNNER_TEMP/check_distribution.py" --wheel "$RUNNER_TEMP"/wheel-dist/*.whl --sdist "$RUNNER_TEMP"/sdist-dist/*.tar.gz --report "$GITHUB_WORKSPACE/evidence/wheel.json" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/wheel.log"
          env -u PYTHONPATH "$RUNNER_TEMP/acprof-sdist-wheel/bin/python" -I "$RUNNER_TEMP/check_distribution.py" --wheel "$RUNNER_TEMP"/sdist-wheel-dist/*.whl --report "$GITHUB_WORKSPACE/evidence/sdist-wheel.json" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sdist-wheel.log"
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wheel
          path: evidence/

  report-browser:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/internal-testing/browser-venv
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装独立锁定浏览器验证环境
        run: |
          uv sync --locked --only-group browser
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"
          uv run --locked --only-group browser playwright install --with-deps chromium
      - name: 离线执行 HTML 交互测试（不允许 skip）
        shell: bash
        env:
          ACPROF_BROWSER_TESTS: '1'
          ACPROF_BROWSER_ARTIFACT_DIR: evidence/browser
          ACPROF_WECOM_WEBHOOK_URL: ''
        run: |
          mkdir -p evidence/browser
          uv run --locked --only-group browser python scripts/run_tests.py --pattern test_report_browser.py \
            --report evidence/browser/tests.json --require-no-skips 2>&1 | tee evidence/browser/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: report-browser
          path: evidence/browser/
          if-no-files-found: error

  tui-snapshots:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group test
      - run: uv pip check
      - name: 固定场景 SVG 回归（统一 pytest 配置）
        run: |
          mkdir -p evidence
          uv run --locked --no-default-groups --group test python -m pytest tests/visual -q --junitxml=evidence/ui.xml
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
          TZ: UTC
          PYTHONHASHSEED: '0'
          ACPROF_SNAPSHOT_OUTPUT_DIR: evidence/svg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tui-snapshots
          path: evidence/
  onnx-cpu:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group runtime-tools
      - name: 无 Torch 的 ONNX 容器接口和 basic 端到端验证（禁止 skip）
        run: uv run --locked --no-default-groups --group runtime-tools python scripts/check_runtime.py --profile onnxruntime-cpu --basic-e2e --output-dir evidence/onnx-cpu
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: onnx-cpu
          path: evidence/
  runtime:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - families: nlp
          - families: cv
          - families: audio multimodal
          - families: diffusion
          - families: structured
          - families: timeseries
          - families: ''
            profile: nlp-transformers5104-cpu
          - families: ''
            profile: custom-multimodal-cpu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-default-groups --group runtime-tools
      - run: |
          runtime_check_status=0
          for family in ${{ matrix.families }}; do
            uv run --locked --no-default-groups --group runtime-tools python scripts/check_runtime.py --family "$family" --variant cpu --output-dir "evidence/$family" || runtime_check_status=1
          done
          if [ "${{ matrix.profile }}" = custom-multimodal-cpu ]; then
            uv run --locked --no-default-groups --group runtime-tools python scripts/check_runtime.py --profile custom-multimodal-cpu --test-pattern test_custom_multimodal_runtime.py --output-dir evidence/custom-multimodal || runtime_check_status=1
          elif [ -n "${{ matrix.profile }}" ]; then
            uv run --locked --no-default-groups --group runtime-tools python scripts/check_runtime.py --profile "${{ matrix.profile }}" --test-pattern test_transformers5_runtime.py --output-dir evidence/transformers5 || runtime_check_status=1
            uv run --locked --no-default-groups --group runtime-tools python scripts/check_runtime.py --profile multimodal-transformers5104-cpu --test-pattern test_audio_generation_runtime.py --output-dir evidence/audio-transformers5 || runtime_check_status=1
          fi
          exit "$runtime_check_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-${{ strategy.job-index }}
          path: evidence/
