name: 离线回归与容器兼容
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m pip check
      - run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: 禁止新增跨模块 private dependency，并清除过期 baseline
        run: python scripts/check_private_api.py

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m mypy

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/host.lock
      - run: python -m pip install --require-hashes -r requirements/host.lock
      - name: 安装 coverage 开发锁（仅 Python 3.12）
        if: matrix.python == '3.12'
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m pip check
      - run: python scripts/compile_locks.py --check
      - run: python scripts/compile_locks.py --host-only --check
        if: matrix.python == '3.12' && matrix.shard == 0
      - name: 校验指标文档编码与同步状态
        run: python scripts/render_metric_reference.py --check
      - run: |
          mkdir -p evidence
          if [[ '${{ matrix.python }}' == '3.12' ]]; then
            python -m coverage run --branch --parallel-mode scripts/run_tests.py --shard-index ${{ matrix.shard }} --shard-count 4 --report evidence/host.json 2>&1 | tee evidence/host.log
          else
            python scripts/run_tests.py --shard-index ${{ matrix.shard }} --shard-count 4 --report evidence/host.json 2>&1 | tee evidence/host.log
          fi
        shell: bash
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
          COVERAGE_FILE: evidence/coverage/.coverage
      - name: 检查 CLI 帮助与源码编译
        run: |
          python run.py --help
          python probe.py --help
          python profile.py --help
          python plot.py --help
          python audit.py --help
          python stats.py --help
          python -m compileall -q acprof scripts run.py probe.py profile.py plot.py audit.py stats.py tui.py
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-${{ matrix.python }}-${{ matrix.shard }}
          path: evidence/
      - name: 上传 Python 3.12 coverage 分片
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.python == '3.12'
        with:
          name: coverage-3.12-${{ matrix.shard }}
          path: evidence/coverage/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
  host-summary:
    needs: host
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-*
          path: evidence/shards
          merge-multiple: false
      - name: 校验两个 Python 版本的完整测试证据
        run: python scripts/aggregate_test_reports.py evidence/shards --report evidence/host-summary.json
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-3.12-*
          path: evidence/coverage-shards
          merge-multiple: false
      - name: 汇总四个 coverage 分片（只记录，不设百分比门槛）
        shell: bash
        env:
          COVERAGE_FILE: evidence/coverage/.coverage
        run: |
          for shard in 0 1 2 3; do
            compgen -G "evidence/coverage-shards/coverage-3.12-${shard}/.coverage.*" >/dev/null || exit 1
          done
          python -m coverage combine --keep evidence/coverage-shards/coverage-3.12-*
          python -m coverage xml -o evidence/coverage/coverage.xml
          python -m coverage json -o evidence/coverage/coverage.json
          python -m coverage html -d evidence/coverage/html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-baseline-3.12
          path: evidence/coverage/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-summary
          path: evidence/host-summary.json

  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.13'
          python-version: '3.12'
      - name: 构建并隔离安装当前提交的 wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel-dist"
          uv venv "$RUNNER_TEMP/acprof-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/acprof-wheel/bin/python" --require-hashes -r requirements/host.lock
          uv pip install --python "$RUNNER_TEMP/acprof-wheel/bin/python" --no-deps "$RUNNER_TEMP"/wheel-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/acprof-wheel/bin/python"
      - name: 从空目录验证安装包、公共入口、报告资源与子进程
        shell: bash
        run: |
          mkdir -p evidence
          cp scripts/check_distribution.py "$RUNNER_TEMP/check_distribution.py"
          cd "$(mktemp -d)"
          env -u PYTHONPATH "$RUNNER_TEMP/acprof-wheel/bin/python" -I "$RUNNER_TEMP/check_distribution.py" --report "$GITHUB_WORKSPACE/evidence/wheel.json" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/wheel.log"
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wheel
          path: evidence/

  tui-snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/host.lock
            requirements/tui-snapshot.lock
      - run: python -m pip install --require-hashes -r requirements/host.lock -r requirements/tui-snapshot.lock
      - run: python -m pip check
      - name: 固定场景 SVG 回归（独立 pytest 环境）
        run: |
          mkdir -p evidence
          python -m pytest tests/visual -q --snapshot-report evidence/ui.html --junitxml=evidence/ui.xml
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
          TZ: UTC
          PYTHONHASHSEED: '0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tui-snapshots
          path: evidence/
  onnx-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/host.lock
      - name: 无 Torch 的 ONNX 容器接口和 basic 端到端验证（禁止 skip）
        run: python scripts/check_runtime.py --profile onnxruntime-cpu --basic-e2e --output-dir evidence/onnx-cpu
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: onnx-cpu
          path: evidence/
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - families: nlp
          - families: cv
          - families: audio multimodal
          - families: diffusion
          - families: structured
          - families: timeseries
          - families: ''
            profile: nlp-transformers560-cpu
          - families: ''
            profile: custom-multimodal-cpu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/host.lock
      - run: |
          runtime_check_status=0
          for family in ${{ matrix.families }}; do
            python scripts/check_runtime.py --family "$family" --variant cpu --output-dir "evidence/$family" || runtime_check_status=1
          done
          if [ "${{ matrix.profile }}" = custom-multimodal-cpu ]; then
            python scripts/check_runtime.py --profile custom-multimodal-cpu --test-pattern test_custom_multimodal_runtime.py --output-dir evidence/custom-multimodal || runtime_check_status=1
          elif [ -n "${{ matrix.profile }}" ]; then
            python scripts/check_runtime.py --profile "${{ matrix.profile }}" --test-pattern test_transformers5_runtime.py --output-dir evidence/transformers5 || runtime_check_status=1
            python scripts/check_runtime.py --profile multimodal-transformers560-cpu --test-pattern test_audio_generation_runtime.py --output-dir evidence/audio-transformers5 || runtime_check_status=1
          fi
          exit "$runtime_check_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-${{ strategy.job-index }}
          path: evidence/
