name: Runtime Images
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

# 平台 tag 对应的 image ID 必须先固定，环境 job 再共享同一父层。
concurrency:
  group: acprof-runtime-images
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      environments: ${{ steps.matrix.outputs.environments }}
      registry: ${{ steps.matrix.outputs.registry }}
    steps:
      - name: 核对运行时镜像发布来源
        id: publication-ref
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          event = os.environ["GITHUB_EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          allowed = (
              event == "workflow_dispatch" and ref == "refs/heads/main"
          ) or (
              event == "push" and re.fullmatch(r"refs/tags/v[0-9]+\.[0-9]+\.[0-9]+", ref)
          )
          if not allowed:
              raise SystemExit(
                  "Runtime image publication requires a stable tag push or workflow_dispatch on main"
              )
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups
      - id: matrix
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          uv run --locked --no-default-groups python - <<'PY'
          import json, os, subprocess, sys
          matrix = json.loads(subprocess.check_output([
              sys.executable, 'scripts/publish_runtime_images.py', '--matrix',
              '--release-tag', os.environ['RELEASE_TAG'],
          ]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, values in matrix.items():
                  print(f'{name}={json.dumps(values)}', file=output)
              print(f'registry=ghcr.io/{os.environ["REPOSITORY"].lower()}/runtime', file=output)
          PY
  platform:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: ${{ fromJSON(needs.matrix.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建、核验并发布平台
        env:
          PLATFORM: ${{ matrix.platform }}
          REGISTRY: ${{ needs.matrix.outputs.registry }}
        run: |
          uv run --locked --no-default-groups python scripts/publish_runtime_images.py --platform "$PLATFORM" --registry "$REGISTRY" --release-tag "$RELEASE_TAG" --push --report evidence/platform.json
          uv run --locked --no-default-groups python scripts/publish_runtime_images.py --platform "$PLATFORM" --registry "$REGISTRY" --release-tag "$RELEASE_TAG" --verify-only --report evidence/platform-remote.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-${{ matrix.platform }}
          path: evidence/
  environment:
    needs: [matrix, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        environment: ${{ fromJSON(needs.matrix.outputs.environments) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 复用已发布平台，核验并发布完整环境
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          REGISTRY: ${{ needs.matrix.outputs.registry }}
        run: |
          uv run --locked --no-default-groups python scripts/publish_runtime_images.py --environment "$ENVIRONMENT" --pull-platform --registry "$REGISTRY" --release-tag "$RELEASE_TAG" --push --report evidence/environment.json
          uv run --locked --no-default-groups python scripts/publish_runtime_images.py --environment "$ENVIRONMENT" --registry "$REGISTRY" --release-tag "$RELEASE_TAG" --verify-only --report evidence/environment-remote.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: environment-${{ matrix.environment }}
          path: evidence/
