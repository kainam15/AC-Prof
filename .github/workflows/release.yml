name: Build & Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['acprof/**', 'dockerfiles/**', 'assets/**', 'examples/**', 'uv.lock', '.python-version', 'pyproject.toml', 'packaging/**', 'scripts/check_distribution.py', 'scripts/release_risk.py', 'scripts/check_dependency_audit.py', 'tests/quality/test_release*.py', 'tests/quality/test_hatch_build.py', 'README.md', 'LICENSE', 'NOTICE', 'licenses/**', '.dockerignore', '.github/release-risk.json', '.github/workflows/release.yml', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --only-group build
      - name: 在构建前核对 tag 与 package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          uv run --locked --only-group build python - <<'PY'
          import os
          from acprof import __version__
          tag = os.environ['RELEASE_TAG']
          if tag and tag != 'v' + __version__:
              raise SystemExit('tag and package version differ')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={__version__}\n')
          PY
      # uv first builds the sdist, then builds the release wheel from that sdist.
      - run: |
          uv export --locked --only-group build --no-emit-project --output-file "$RUNNER_TEMP/build.txt"
          uv build --build-constraint "$RUNNER_TEMP/build.txt" --require-hashes
      - name: 固定待发布制品的 SHA256
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  verify-dist:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - run: cd dist && sha256sum --check SHA256SUMS
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - name: uv pip 安装发布 wheel 并验证完整 CLI 与资源
        run: |
          uv venv .release-venv --python 3.12
          uv pip install --python .release-venv/bin/python dist/*.whl
          uv pip check --python .release-venv/bin/python
          .release-venv/bin/python -I scripts/check_distribution.py \
            --wheel dist/*.whl --sdist dist/*.tar.gz --expected-version "$RELEASE_VERSION" \
            --report evidence/wheel.json
      - name: 从 sdist 独立重建并用 uv 安装（不替换发布制品）
        working-directory: ${{ runner.temp }}
        run: |
          uv export --project "$GITHUB_WORKSPACE" --locked --only-group build --no-emit-project --output-file "$RUNNER_TEMP/build.txt"
          uv build --build-constraint "$RUNNER_TEMP/build.txt" --require-hashes --wheel "$GITHUB_WORKSPACE"/dist/*.tar.gz --out-dir "$RUNNER_TEMP/rebuilt-dist"
          uv venv "$RUNNER_TEMP/sdist-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/sdist-venv/bin/python" "$RUNNER_TEMP"/rebuilt-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/sdist-venv/bin/python"
          "$RUNNER_TEMP/sdist-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_distribution.py" \
            --wheel "$RUNNER_TEMP"/rebuilt-dist/*.whl --sdist "$GITHUB_WORKSPACE"/dist/*.tar.gz \
            --expected-version "$RELEASE_VERSION" --report "$GITHUB_WORKSPACE/evidence/sdist.json"
      - name: uv tool 隔离安装及命令发现
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/acprof-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/acprof-bin
        run: |
          uv tool install --python 3.12 "$GITHUB_WORKSPACE"/dist/*.whl
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          test "$(acprof --version)" = "AC-Prof $RELEASE_VERSION"
          acprof --help
      - name: 核对两种 wheel 的 Docker context 身份
        run: |
          uv run --locked --only-group build python - <<'PY'
          import json
          from pathlib import Path
          def fingerprint(name):
              checks = json.loads(Path(f'evidence/{name}.json').read_text())['checks']
              return next(item['fingerprint'] for item in checks if item.get('check') == 'installed_docker_context')
          assert fingerprint('wheel') == fingerprint('sdist'), 'rebuilt Docker context differs'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: distribution-evidence
          path: evidence/

  standalone:
    needs: [build, verify-dist]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/internal-testing/standalone-venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - run: cd dist && sha256sum --check SHA256SUMS
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - name: 从同一 wheel 准备锁定的 standalone 环境
        run: |
          uv sync --locked --no-default-groups --group standalone --no-install-project
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps dist/*.whl
          uv pip check --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: 构建并验证 standalone
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Keep the verified installed wheel; syncing here would replace it with the checkout.
          uv run --locked --no-sync python -m PyInstaller --noconfirm --clean packaging/acprof.spec
          uv run --locked --no-sync python scripts/check_distribution.py --binary dist/acprof \
            --expected-version "$RELEASE_VERSION" --report evidence/standalone.json
          mv dist/acprof dist/acprof-linux-x86_64
          cd dist
          sha256sum acprof-linux-x86_64 > STANDALONE-SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-dist
          path: |
            dist/acprof-linux-x86_64
            dist/STANDALONE-SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: standalone-evidence
          path: evidence/

  hardware-gate:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --only-group build
      - name: 验证同提交 Native Linux CPU/GPU/RAPL/perf 测量证据
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/hardware.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success -f per_page=50 > hardware-runs.json
          uv run --locked --only-group build python - <<'PY' > hardware-runs.tsv
          import json
          import os
          from pathlib import Path
          for run in json.loads(Path("hardware-runs.json").read_text())["workflow_runs"]:
              if (run["head_sha"] == os.environ["GITHUB_SHA"] and run["head_branch"] == "main"
                      and run["event"] in ("schedule", "workflow_dispatch")
                      and run["conclusion"] == "success"):
                  print(f'{run["id"]}\t{run["html_url"]}')
          PY
          verified=0
          while IFS=$'\t' read -r run_id run_url; do
            [[ -n "$run_id" ]] || continue
            rm -rf "$RUNNER_TEMP/hardware-release-evidence"
            mkdir -p "$RUNNER_TEMP/hardware-release-evidence"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name hardware \
              --dir "$RUNNER_TEMP/hardware-release-evidence"; then
              continue
            fi
            if uv run --locked --only-group build python scripts/verify_hardware_evidence.py \
              --report "$RUNNER_TEMP/hardware-release-evidence/measurements/hardware_matrix.json" \
              --matrix examples/hardware-validation.json --commit "$GITHUB_SHA" \
              --run-url "$run_url" --output hardware-proof.json; then
              verified=1
              break
            fi
          done < hardware-runs.tsv
          if [[ "$verified" != 1 ]]; then
            echo "::error::No complete same-commit Native Linux CPU/GPU evidence. Run hardware.yml on main before tagging."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardware-proof
          path: hardware-proof.json

  release-risk:
    needs: [build, verify-dist, standalone]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-evidence
          path: distribution-evidence/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-evidence
          path: distribution-evidence/
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --only-group audit
      - name: 核对待发布制品并审计实际依赖快照与 runtime 锁
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS && sha256sum --check STANDALONE-SHA256SUMS)
          uv run --locked --only-group audit python scripts/release_risk.py scan \
            --commit "$RELEASE_COMMIT" --dist dist --evidence-dir distribution-evidence \
            --output-dir release-risk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-risk-evidence
          path: release-risk/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, verify, verify-dist, standalone, hardware-gate, release-risk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --only-group build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-dist
          path: dist/
      - name: 核对并合并发布校验和
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          sha256sum --check STANDALONE-SHA256SUMS
          cat STANDALONE-SHA256SUMS >> SHA256SUMS
          rm STANDALONE-SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hardware-proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-risk-evidence
          path: release-risk/
      - name: 再次核对发布风险身份并保留审计证据
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release_risk.py verify --commit "$RELEASE_COMMIT" --dist dist \
            --proof release-risk/release-risk.json
          cp release-risk/release-risk.json dist/release-risk.json
          tar -czf dist/dependency-audit-evidence.tar.gz -C release-risk .
          (cd dist && sha256sum release-risk.json dependency-audit-evidence.tar.gz >> SHA256SUMS)
      - name: 记录已验证的同提交硬件证据
        run: |
          uv run --locked --only-group build python - <<'EOPY'
          import json
          import os
          from pathlib import Path

          sha = os.environ['GITHUB_SHA']
          hardware = json.loads(Path('hardware-proof.json').read_text())
          if hardware.get('commit') != sha or hardware.get('status') != 'verified':
              raise SystemExit('release hardware proof is missing, invalid or from another commit')
          evidence = {'schema_version': 1, 'commit': sha,
                      'ci': {'status': 'passed',
                             'required_jobs': ['lint', 'host', 'onnx-cpu', 'runtime', 'build',
                                               'verify-dist', 'standalone'],
                             'run_url': os.environ['GITHUB_SERVER_URL'] + '/'
                                        + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/'
                                        + os.environ['GITHUB_RUN_ID']},
                      'hardware': hardware,
                      'dependency_risk': json.loads(Path('dist/release-risk.json').read_text())}
          Path('dist/verification.json').write_text(json.dumps(evidence, indent=2) + '\n')
          Path('verification-notes.md').write_text(
              'Validation scope is recorded in verification.json.\n\n'
              + 'Hardware evidence: ' + hardware['run_url'] + '\n')
          EOPY
          cd dist
          sha256sum verification.json >> SHA256SUMS
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --notes-file verification-notes.md

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, verify, verify-dist, standalone, hardware-gate, release-risk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/acprof/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-risk-evidence
          path: release-risk/
      - name: 核对 wheel 与 sdist 的依赖风险身份
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release_risk.py verify --commit "$RELEASE_COMMIT" --dist dist \
            --proof release-risk/release-risk.json --python-only
      - name: 核对制品并仅暂存 wheel 与 sdist
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir ../pypi-dist
          cp -- *.whl *.tar.gz ../pypi-dist/
      - name: 使用 GitHub OIDC 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          print-hash: true

  pypi-smoke:
    needs: [build, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - run: uv sync --locked --only-group build
      - name: 等待 PyPI 可见并核对安装和制品哈希
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/acprof-pypi-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/acprof-pypi-bin
        run: |
          check_pypi_hashes() {
            uv run --project "$GITHUB_WORKSPACE" --locked --only-group build python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          with urllib.request.urlopen(f'https://pypi.org/pypi/acprof/{version}/json', timeout=30) as response:
              release = json.load(response)
          remote = {item['filename']: item['digests']['sha256'] for item in release['urls']}
          dist = Path(os.environ['GITHUB_WORKSPACE']) / 'dist'
          wheels, sdists = list(dist.glob('*.whl')), list(dist.glob('*.tar.gz'))
          assert len(wheels) == len(sdists) == 1, 'expected one wheel and one sdist'
          for path in [*wheels, *sdists]:
              assert remote.get(path.name) == hashlib.sha256(path.read_bytes()).hexdigest(), path.name
          PY
          }
          export PATH="$UV_TOOL_BIN_DIR:$PATH"
          for attempt in 1 2 3 4 5; do
            if check_pypi_hashes && uv tool install --python 3.12 --refresh \
              --index-url https://pypi.org/simple "acprof==$RELEASE_VERSION"; then
              test "$(acprof --version)" = "AC-Prof $RELEASE_VERSION"
              acprof --help
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          echo '::warning::PyPI installation verification failed after 5 attempts; inspect the published version, never overwrite it.'
          exit 1
