name: Hardware Validation
on:
  schedule:
    - cron: '15 3 * * 1' # Weekly Monday 03:15 UTC; main branch only.
  workflow_dispatch:
    inputs:
      preset:
        description: 固定小模型矩阵或自定义单模型（先自动准备镜像，再离线验收）
        type: choice
        options: ['pinned-matrix', 'custom']
        default: pinned-matrix
      model:
        description: Hugging Face 模型 ID
        required: true
        default: hf-internal-testing/tiny-random-bert
      task:
        description: 已支持任务覆盖
        required: true
        default: fill-mask
      revision:
        description: 自定义模型的 revision；留空时由运行准备阶段解析并存证
        required: false
      gpus:
        description: off / on / off,on
        type: choice
        options: ['off', 'on', 'off,on']
        default: off,on
permissions:
  contents: read
concurrency:
  group: acprof-dedicated-hardware
  cancel-in-progress: false
jobs:
  profile:
    # Never execute fork PRs or arbitrary branches on the dedicated host.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, acprof]
    timeout-minutes: 180
    env:
      VIRTUAL_ENV: ''
      VALIDATION_PRESET: ${{ github.event_name == 'schedule' && 'pinned-matrix' || inputs.preset }}
      VALIDATION_MODEL: ${{ inputs.model }}
      VALIDATION_TASK: ${{ inputs.task }}
      VALIDATION_REVISION: ${{ inputs.revision }}
      VALIDATION_GPUS: ${{ github.event_name == 'schedule' && 'off,on' || inputs.gpus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false # 专用主机复用已准备的 .venv 和本地验证产物。
      - name: 拒绝与触发提交不一致的已跟踪代码
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
      - name: 在测量开始前同步锁定的主机和测试环境
        run: uv sync --locked --no-default-groups --group test
      - name: 离线故障回归（取消、恢复、清理和采样失败，不作为硬件证据）
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
        run: |
          uv run --locked --no-default-groups --group test python scripts/run_tests.py \
            --pattern test_monitor_cleanup.py --pattern test_run_recovery.py \
            --pattern test_runtime_validation.py --pattern test_perf_mips.py \
            --pattern test_energy_cpu.py --pattern test_energy_nvml_start_stop.py \
            --require-no-skips \
            --report "internal-testing/hardware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/offline-faults/host.json"
      - name: 测量前准备缺失的模型和 Docker 镜像
        timeout-minutes: 90
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
          ACPROF_REQUIRE_PREPARED_IMAGE: '0'
          HF_HUB_OFFLINE: '0'
          TRANSFORMERS_OFFLINE: '0'
          ACPROF_RUNTIME_IMAGE_SOURCE: auto
          ACPROF_MAX_DOWNLOAD: 4GB
        shell: bash
        run: |
          if [[ "$VALIDATION_PRESET" == pinned-matrix ]]; then
            selection=(--matrix examples/hardware-validation.json)
          else
            selection=(--model "$VALIDATION_MODEL" --task "$VALIDATION_TASK" --revision "$VALIDATION_REVISION")
          fi
          uv run --locked --no-default-groups --group test python scripts/prepare_hardware.py "${selection[@]}" --gpus "$VALIDATION_GPUS" \
            --output-dir "internal-testing/hardware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/preparation"
      - name: 使用已准备的不可变镜像离线采集并验收
        timeout-minutes: 60
        env:
          ACPROF_WECOM_WEBHOOK_URL: ''
        run: |
          uv run --locked --no-default-groups --group test python scripts/check_hardware.py \
            --matrix "internal-testing/hardware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/preparation/prepared-matrix.json" \
            --gpus "$VALIDATION_GPUS" \
            --output-dir "internal-testing/hardware-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/measurements"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hardware
          path: internal-testing/hardware-${{ github.run_id }}-${{ github.run_attempt }}/
