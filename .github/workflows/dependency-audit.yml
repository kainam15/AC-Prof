name: Dependency Vulnerability Audit

on:
  schedule:
    - cron: '41 3 * * 2' # Weekly Tuesday, UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dockerfiles/locks/**'
      - 'acprof/extensions/builtin/manifest.json'
      - 'acprof/dependency_locks.py'
      - 'scripts/export_runtime_audit_requirements.py'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/check_dependency_audit.py'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python ${{ matrix.lock }} (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lock: host, python: '3.12'}
          - {lock: test, python: '3.12'}
          - {lock: dev, python: '3.12'}
          - {lock: runtime-test, python: '3.12'}
          - {lock: browser, python: '3.12'}
          - {lock: audit, python: '3.12'}
          - {lock: build, python: '3.12'}
          - {lock: standalone, python: '3.12'}
          - {lock: host, python: '3.13'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the isolated locked auditing group
        run: uv sync --locked --only-group audit
      - name: Export the selected group with hashes
        env:
          AUDIT_GROUP: ${{ matrix.lock }}
        run: |
          if [ "$AUDIT_GROUP" = host ]; then
            uv export --locked --no-default-groups --no-emit-project --output-file audit-requirements.txt
          else
            uv export --locked --only-group "$AUDIT_GROUP" --no-emit-project --output-file audit-requirements.txt
          fi
      - name: Audit pinned dependencies (report only)
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          uv run --locked --only-group audit python -m pip_audit --require-hashes --disable-pip \
            --progress-spinner off --format json \
            --output "audit-${{ matrix.lock }}.json" \
            -r audit-requirements.txt
      - name: Check report completeness and summarize findings
        if: always()
        run: uv run --locked --only-group audit python scripts/check_dependency_audit.py "audit-${{ matrix.lock }}.json" "${{ matrix.lock }}.lock"
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.lock }}-${{ matrix.python }}
          path: audit-${{ matrix.lock }}.json
          if-no-files-found: error
          retention-days: 30

  runtime-locks:
    name: Docker runtime wheel locks (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version-file: pyproject.toml
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the isolated locked auditing group
        run: uv sync --locked --only-group audit
      - name: Export every registered runtime wheel lock
        run: |
          uv run --locked --only-group audit python scripts/export_runtime_audit_requirements.py \
            --output-dir runtime-audit/requirements --python-version 3.12
      - name: Audit runtime package versions without installing runtime wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-audit/reports
          for requirements in runtime-audit/requirements/*.txt; do
            lock="${requirements##*/}"
            result=0
            uv run --locked --only-group audit python -m pip_audit --require-hashes --disable-pip \
              --progress-spinner off --format json \
              --output "runtime-audit/reports/${lock%.txt}.json" \
              -r "${requirements}" || result=$?
            if (( result > 1 )); then
              echo "Runtime lock audit could not complete: ${lock} (exit ${result})" >&2
              exit "${result}"
            fi
            uv run --locked --only-group audit python scripts/check_dependency_audit.py \
              "runtime-audit/reports/${lock%.txt}.json" "${lock}"
          done
      - name: Publish runtime lock audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-docker-runtime-locks
          path: runtime-audit/reports/*.json
          if-no-files-found: error
          retention-days: 30
