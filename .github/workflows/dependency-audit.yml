name: Dependency Vulnerability Audit

on:
  schedule:
    - cron: '41 3 * * 2' # Weekly Tuesday, UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'requirements/**'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/check_dependency_audit.py'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python ${{ matrix.lock }} (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lock: host, python: '3.10'}
          - {lock: test, python: '3.10'}
          - {lock: dev, python: '3.10'}
          - {lock: runtime-test, python: '3.10'}
          - {lock: browser, python: '3.12'}
          - {lock: audit, python: '3.10'}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/audit.lock
      - name: Install hash-locked auditing tool
        run: python -m pip install --require-hashes -r requirements/audit.lock
      - name: Audit pinned dependencies (report only)
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          python -m pip_audit --require-hashes --disable-pip \
            --progress-spinner off --format json \
            --output "audit-${{ matrix.lock }}.json" \
            -r "requirements/${{ matrix.lock }}.lock"
      - name: Check report completeness and summarize findings
        if: always()
        run: python scripts/check_dependency_audit.py "audit-${{ matrix.lock }}.json" "${{ matrix.lock }}.lock"
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ matrix.lock }}
          path: audit-${{ matrix.lock }}.json
          if-no-files-found: error
          retention-days: 30
