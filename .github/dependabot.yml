version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
# Python and Docker artifact locks require coordinated regeneration and SHA256
# verification. Automated version PRs are deferred until their lock workflow
# can preserve the project's hash and OCI digest consistency requirements.
