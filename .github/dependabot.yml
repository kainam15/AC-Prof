version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
# Python/Docker runtime artifact locks are refreshed together by the monthly
# .github/workflows/lock-refresh.yml, with exact hash verification and manual PR review.
# Dependabot stays scoped to Actions to avoid unsynchronized lock mutations.
